<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16130F" />
    <title>Sem conexão — Engenho Cidadão</title>
    <!--
      Única página que o service worker guarda. Não tem dado de ninguém: o app
      não funciona offline por decisão de escopo, e dado de aluno desatualizado
      em cache é pior que erro de rede (CLAUDE.md, seção PWA).
    -->
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f5f3ef;
        color: #16130f;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      img { width: 96px; height: 96px; border-radius: 12px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { margin: 0 0 24px; line-height: 1.5; color: #4a4540; }
      button {
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 8px;
        background: #16130f;
        color: #f5f3ef;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icones/icone-192.png" alt="" />
      <h1>Sem conexão</h1>
      <p>
        O app precisa de internet. Nenhum dado fica guardado no aparelho — confira
        o Wi-Fi ou os dados móveis e tente de novo.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
